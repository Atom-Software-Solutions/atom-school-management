version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: asm-quickstart-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atom_school_db
    volumes:
      - pgdata_quickstart:/var/lib/postgresql/data

  app:
    image: ghcr.io/atom-software-solutions/atom-school-management:develop
    platform: linux/amd64
    container_name: asm-quickstart-app
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atom_school_db?schema=user_mgt&schema=payment_mgt&schema=student_mgt
      JWT_SECRET: quickstart-secret-change-me
      JWT_EXPIRES_IN: 7d
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      SUPER_ADMIN_FIRST_NAME: Quick
      SUPER_ADMIN_LAST_NAME: Start
      SUPER_ADMIN_PHONE: "+0000000000"
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Generating Prisma client...' &&
        npx prisma generate &&
        echo 'Syncing Prisma client for compiled code...' &&
        rm -rf dist/generated && mkdir -p dist && cp -R generated dist/ &&
        echo 'Starting application...' &&
        node dist/src/main.js
      "

volumes:
  pgdata_quickstart:
    driver: local
