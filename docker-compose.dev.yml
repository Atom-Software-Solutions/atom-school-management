services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: atom-school-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atom_school_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atom-school-network-dev

  # NestJS Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: atom-school-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "9229:9229" # Debug port
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atom_school_db?schema=user_mgt&schema=payment_mgt&schema=student_mgt
      JWT_SECRET: quickstart-secret-change-me
      JWT_EXPIRES_IN: 7d
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      SUPER_ADMIN_FIRST_NAME: Quick
      SUPER_ADMIN_LAST_NAME: Start
      SUPER_ADMIN_PHONE: "+0000000000"
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atom-school-network-dev
    command: >
      sh -c "
        set -e &&
        echo 'Waiting for database to be ready...' &&
        sleep 3 &&
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Starting application in development mode...' &&
        npm run start:dev
      "

volumes:
  postgres_data_dev:
    driver: local

networks:
  atom-school-network-dev:
    driver: bridge
